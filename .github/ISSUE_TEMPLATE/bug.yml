name: Report a bug
description: Something broke, or looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste your session key or any cookie value here. Field names are fine, secrets are not.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: ClaudeBar version
      description: Shown at the bottom of Preferences.
  - type: input
    id: macos
    attributes:
      label: macOS version
  - type: dropdown
    id: connect
    attributes:
      label: How did you connect?
      options:
        - Connect button (automatic)
        - Pasted my session key
        - Not connected yet
