<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClaudeBar share card</title>
<style>
  @font-face { font-family: "Press Start 2P"; src: url("fonts/PressStart2P.ttf"); font-weight: 400 700; }
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; background: #15100d; color: #f3e6d8; font-family: "Press Start 2P", monospace; overflow: hidden; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px; display: flex; }
  .left { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; padding-right: 32px; }
  .chip { align-self: flex-start; font-size: 14px; letter-spacing: .03em; text-transform: uppercase; color: #e6b79b; border: 2px solid #5b4337; padding: 10px 14px; }
  h1 { margin: 0; font-size: 46px; line-height: 1.4; letter-spacing: .01em; text-transform: uppercase; font-weight: 700; }
  .foot { font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: #b89f8c; }
  .foot b { color: #d2795a; font-weight: 700; }
  .right { flex: 0 0 380px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .stage { height: 300px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to bottom, #4A2528 0 14.28%, #69272A 14.28% 28.57%, #8A2E2B 28.57% 42.85%, #A8392F 42.85% 57.14%, #C44736 57.14% 71.42%, #D9573C 71.42% 85.71%, #E4684A 85.71% 100%); }
  .stage img { width: 320px; height: 240px; image-rendering: pixelated; }
  .bar { display: flex; gap: 5px; height: 36px; }
  .bar i { flex: 1; background: #2c211c; }
</style>
</head>
<body>
<div class="card">
  <div class="left">
    <span class="chip">Free · Open source · macOS</span>
    <h1>Never hit your Claude limit blind.</h1>
    <div class="foot"><b>ClaudeBar</b> &nbsp;·&nbsp; free for Mac</div>
  </div>
  <div class="right">
    <div class="stage"><img src="export/moods/dark/mood-maxed-0.png" alt=""></div>
    <div class="bar" id="bar"></div>
  </div>
</div>
<script>
  var stops = [[0,[244,199,142]],[0.45,[224,136,95]],[0.8,[212,87,63]],[1,[143,63,122]]];
  function sky(t){ for (var i=1;i<stops.length;i++){ if (t<=stops[i][0]) { var a=stops[i-1], b=stops[i], k=(t-a[0])/(b[0]-a[0]); return 'rgb('+a[1].map(function(v,j){return Math.round(v+(b[1][j]-v)*k)}).join(',')+')'; } } return 'rgb(143,63,122)'; }
  var bar = document.getElementById('bar'), filled = 27;
  for (var i=0;i<30;i++){ var c=document.createElement('i'); if (i<filled) c.style.background = sky((i+0.5)/30); bar.appendChild(c); }
</script>
</body>
</html>
